services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./:/app/
      # Vite installs a native binary for the platform it was installed on, so
      # the container cannot share the host's node_modules. It keeps its own,
      # populated by `make install`.
      - node_modules:/app/node_modules
      # Chrome is downloaded by `make install` rather than baked into the
      # image, so it stays matched to the puppeteer that node_modules holds.
      - puppeteer_cache:/root/.cache/puppeteer
    working_dir: /app/
    command: "npm run dev"
    # The syncing scenarios sync through the db service, which the browser in
    # this container reaches by name.
    depends_on:
      - db
    environment:
      COUCHDB_URL: 'http://db:5984'

  db:
    image: couchdb:3
    environment:
      COUCHDB_PASSWORD: 'password'
      COUCHDB_USER: 'admin'
    ports:
      - "5984:5984"
    volumes:
      - ./db-config/couchdb/:/opt/couchdb/etc/local.d/

volumes:
  node_modules:
  puppeteer_cache:
