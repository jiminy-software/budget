name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 3d3c42e = v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 8207627 = v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds the app and serves it before driving it with Puppeteer, so a
      # broken build fails here too.
      - run: npm run test:ui

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 3d3c42e = v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 8207627 = v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # fc324d3 = v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a running deploy finish; queue at most one more behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # cd2ce8f = v5.0.1
